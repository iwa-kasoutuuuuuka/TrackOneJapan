<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TrackOne Japan 画面イメージ</title>
<style>
  :root {
    --navy: #1F4A85; --navy-dark: #0D2346; --red: #E63946; --teal: #20B7A3; --teal-l: #35D0BA;
    --orange: #F08C00; --green: #2B9348; --gray: #8A94A6; --bg: #EEF1F6; --ink: #1B2333; --sub: #5B6475;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: "Yu Gothic UI", "Meiryo UI", "Hiragino Sans", sans-serif; color: var(--ink); padding: 36px 40px 44px; width: 1180px; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  header img { width: 56px; height: 56px; }
  header h1 { font-size: 26px; letter-spacing: .02em; }
  header p { color: var(--sub); font-size: 14px; margin-top: 2px; }
  .grid { display: grid; grid-template-columns: repeat(3, 340px); gap: 36px 40px; justify-content: center; }
  figure { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  figcaption { font-size: 15px; font-weight: 700; }
  figcaption span { display: block; font-weight: 400; color: var(--sub); font-size: 12.5px; text-align: center; margin-top: 2px; }
  .phone { width: 300px; height: 620px; border-radius: 38px; background: #10151F; padding: 10px; box-shadow: 0 14px 30px rgba(13,35,70,.18); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 30px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
  .status { height: 26px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 11px; font-weight: 600; flex: none; }
  .status.light { color: #fff; }
  .appbar { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; flex: none; }
  .appbar .title { font-size: 16px; font-weight: 700; }
  .tabs { display: flex; background: #EDF1F7; border-radius: 18px; padding: 3px; }
  .tabs b { font-size: 12.5px; padding: 5px 16px; border-radius: 15px; color: var(--sub); font-weight: 600; }
  .tabs b.on { background: #fff; color: var(--navy); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .ico { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bell { position: relative; }
  .badge { position: absolute; top: -5px; right: -7px; background: var(--red); color: #fff; font-size: 9.5px; font-weight: 700; border-radius: 8px; padding: 1px 5px; }
  .map { position: relative; flex: 1; overflow: hidden; }
  .map > svg.bgmap { position: absolute; inset: 0; width: 100%; height: 100%; }
  .fab { position: absolute; right: 10px; width: 36px; height: 36px; border-radius: 10px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); display: flex; align-items: center; justify-content: center; }
  .fab .ico { width: 18px; height: 18px; stroke: var(--navy); }
  .attr { position: absolute; left: 6px; bottom: 4px; font-size: 8px; color: #555; background: rgba(255,255,255,.75); padding: 1px 4px; border-radius: 3px; }
  .marker { position: absolute; transform: translate(-50%, -50%); }
  .marker .dot { width: 34px; height: 34px; border-radius: 50%; background: var(--navy); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; }
  .marker .dot svg { width: 18px; height: 18px; fill: #fff; }
  .marker .label { position: absolute; top: -24px; left: 50%; transform: translateX(-50%); background: #fff; color: var(--navy); font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 8px; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .card { background: #fff; border-radius: 18px 18px 0 0; box-shadow: 0 -4px 14px rgba(0,0,0,.08); padding: 14px 16px 8px; flex: none; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .name { font-size: 17px; font-weight: 700; }
  .pill { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 10px; }
  .pill.stop { background: #FFF1DB; color: #B86200; }
  .pill.move { background: #DDF5E6; color: var(--green); }
  .pill.off { background: #ECEEF2; color: var(--gray); }
  .addr { font-size: 12px; color: var(--sub); margin: 6px 0 10px; line-height: 1.5; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid #EEF0F4; border-bottom: 1px solid #EEF0F4; padding: 8px 0; }
  .stats div { text-align: center; font-size: 11px; color: var(--sub); }
  .stats b { display: block; color: var(--ink); font-size: 13px; margin-top: 1px; }
  .updated { font-size: 10.5px; color: var(--gray); margin-top: 6px; }
  .menu { display: grid; grid-template-columns: repeat(4, 1fr); padding: 10px 6px 14px; background: #fff; flex: none; }
  .menu div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10.5px; color: var(--sub); }
  .menu .circle { width: 38px; height: 38px; border-radius: 13px; display: flex; align-items: center; justify-content: center; }
  .menu .circle .ico { stroke: #fff; width: 19px; height: 19px; }
  /* ログイン */
  .login-top { background: linear-gradient(160deg, #24569A, var(--navy-dark)); color: #fff; padding: 6px 0 34px; text-align: center; flex: none; }
  .login-top img { width: 92px; height: 92px; margin: 26px auto 12px; display: block; filter: drop-shadow(0 6px 12px rgba(0,0,0,.25)); }
  .login-top h2 { font-size: 22px; letter-spacing: .03em; }
  .login-top p { font-size: 12px; opacity: .8; margin-top: 4px; }
  .form { padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .field { border: 1.5px solid #D5DAE3; border-radius: 12px; padding: 7px 12px; position: relative; }
  .field small { font-size: 10px; color: var(--sub); display: block; }
  .field div { font-size: 13px; margin-top: 1px; }
  .field.focus { border-color: var(--navy); }
  .field .qr { position: absolute; right: 10px; top: 12px; }
  .btn { background: var(--navy); color: #fff; text-align: center; font-weight: 700; border-radius: 12px; padding: 12px; font-size: 14px; }
  .note { font-size: 10.5px; color: var(--gray); text-align: center; line-height: 1.6; }
  /* 一覧 */
  .list { flex: 1; background: #F5F7FA; padding: 10px; display: flex; flex-direction: column; gap: 9px; }
  .item { background: #fff; border-radius: 14px; padding: 11px 12px; display: flex; gap: 11px; align-items: flex-start; }
  .item .av { width: 40px; height: 40px; border-radius: 12px; flex: none; display: flex; align-items: center; justify-content: center; }
  .item .av svg { width: 22px; height: 22px; fill: #fff; }
  .item .body { flex: 1; min-width: 0; }
  .item .t { display: flex; justify-content: space-between; align-items: center; }
  .item .t b { font-size: 14px; }
  .item .a { font-size: 11px; color: var(--sub); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .m { font-size: 10.5px; color: var(--gray); margin-top: 4px; display: flex; gap: 10px; }
  .search { margin: 0 10px 8px; background: #EDF1F7; border-radius: 10px; padding: 7px 12px; font-size: 12px; color: var(--gray); flex: none; }
  /* 再生 */
  .chips { display: flex; gap: 6px; padding: 0 12px 8px; flex: none; overflow: hidden; }
  .chip { font-size: 11.5px; border: 1.5px solid #D5DAE3; border-radius: 14px; padding: 4px 10px; color: var(--sub); font-weight: 600; white-space: nowrap; flex: none; }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .panel { padding: 12px 16px 16px; flex: none; background: #fff; box-shadow: 0 -4px 14px rgba(0,0,0,.08); border-radius: 18px 18px 0 0; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; margin-bottom: 12px; }
  .kpis b { display: block; font-size: 16px; }
  .kpis small { font-size: 10.5px; color: var(--sub); }
  .now { font-size: 11px; color: var(--sub); display: flex; justify-content: space-between; margin-bottom: 6px; }
  .player { display: flex; align-items: center; gap: 10px; }
  .play { width: 38px; height: 38px; border-radius: 50%; background: var(--ink); display: flex; align-items: center; justify-content: center; flex: none; }
  .bar { flex: 1; height: 5px; background: #E1E5EC; border-radius: 3px; position: relative; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 46%; background: var(--teal); border-radius: 3px; }
  .bar u { position: absolute; left: 46%; top: 50%; width: 15px; height: 15px; border-radius: 50%; background: #fff; border: 3px solid var(--teal); transform: translate(-50%, -50%); }
  .speed { font-size: 12px; font-weight: 700; border: 1.5px solid var(--ink); border-radius: 12px; padding: 3px 9px; }
  /* アラーム */
  .alarms { flex: 1; background: #F5F7FA; padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 7px; }
  .day { font-size: 11px; color: var(--sub); font-weight: 700; margin: 6px 4px 0; }
  .al { background: #fff; border-radius: 13px; padding: 10px 11px; display: flex; gap: 10px; align-items: center; position: relative; }
  .al .ic { width: 34px; height: 34px; border-radius: 10px; flex: none; display: flex; align-items: center; justify-content: center; }
  .al .ic .ico { stroke: #fff; width: 18px; height: 18px; }
  .al b { font-size: 13px; display: block; }
  .al small { font-size: 10.5px; color: var(--sub); display: block; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
  .al time { position: absolute; right: 11px; top: 10px; font-size: 10.5px; color: var(--gray); }
  .unread::after { content: ""; position: absolute; left: 4px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--red); }
  /* ジオフェンス */
  .sheet { padding: 14px 16px 16px; background: #fff; box-shadow: 0 -4px 14px rgba(0,0,0,.08); border-radius: 18px 18px 0 0; flex: none; display: flex; flex-direction: column; gap: 11px; }
  .slider { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .slider .bar i { width: 30%; background: var(--navy); }
  .slider .bar u { left: 30%; border-color: var(--navy); }
  .toggles { display: flex; gap: 8px; }
  .tg { flex: 1; border: 1.5px solid #D5DAE3; border-radius: 11px; padding: 8px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
  .sw { width: 30px; height: 17px; border-radius: 9px; background: #CBD2DD; position: relative; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; }
  .sw.on { background: var(--teal); }
  .sw.on::after { left: 15px; }
  footer { margin-top: 30px; text-align: center; font-size: 12px; color: var(--sub); }
</style>
</head>
<body>
