name: trackone_japan
description: "TrackOne Japan - GPS 発信機の位置を日本語で確認するアプリ"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  web_socket_channel: ^3.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/markers/

# ---------- オリジナルアイコン（dart run flutter_launcher_icons で生成）----------
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon-1024.png"
  min_sdk_android: 24
  adaptive_icon_background: "#1F4A85"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon-monochrome.png"

# ---------- 起動画面（dart run flutter_native_splash:create で生成）----------
flutter_native_splash:
  color: "#1F4A85"
  image: "assets/icon/splash.png"
  android_12:
    color: "#1F4A85"
    image: "assets/icon/splash.png"
  ios: true
  web: false
